spring:
  application:
    name: petstorepetservice
  datasource:
    url: ${petservice-db-url:jdbc:postgresql://localhost:5432/petstorepetservice_db?currentSchema=public}
    username: ${petservice-db-username:petuser}
    password: ${petservice-db-password:petpass}
    azure:
      passwordless-enabled: true
  jpa:
    open-in-view: false
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: petstore-kv
              endpoint: https://petstore-kv.vault.azure.net/
              enabled: true
      credential:
        managed-identity-enabled: true
server:
  port: ${PETSTOREPETSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
