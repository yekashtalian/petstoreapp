spring:
  application:
    name: petstoreproductservice
  datasource:
    url: ${PETSTOREPRODUCTSERVICE_DB_URL:jdbc:postgresql://localhost:5432/petstoreproductservice_db?currentSchema=public}
    username: ${PETSTOREPRODUCTSERVICE_DB_USER:productuser}
    password: ${PETSTOREPRODUCTSERVICE_DB_PASSWORD:productpass}
    azure:
      passwordless-enabled: true
  jpa:
    open-in-view: false
server:
  port: ${PETSTOREPRODUCTSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
