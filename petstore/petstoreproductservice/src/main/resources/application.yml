spring:
  application:
    name: petstoreproductservice
  datasource:
    url: ${productservice-db-url:jdbc:postgresql://localhost:5432/petstoreproductservice_db?currentSchema=public}
    username: ${productservice-db-username:productuser}
    password: ${productservice-db-password:productpass}
    azure:
      passwordless-enabled: true
  jpa:
    open-in-view: false
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: petstore-kv
              endpoint: https://petstore-kv.vault.azure.net/
      credential:
        managed-identity-enabled: true
server:
  port: ${PETSTOREPRODUCTSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
  pre-loading-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
